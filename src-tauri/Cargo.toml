[package]
name = "firmar"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "firmar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
aes-gcm = "0.11.1"
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
base64 = "0.23.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
lopdf = { version = "0.46.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
keyring = "4.2.0"
getrandom = "0.4"
zeroize = "1.9.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
argon2 = "0.6.0"
tauri-plugin-opener = "2"
ab_glyph = "0.2.32"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[target.'cfg(windows)'.dependencies]
# Windows Hello (misma versión que usa Tauri internamente).
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Argon2 sin optimizar tarda segundos por derivación incluso en desarrollo.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

